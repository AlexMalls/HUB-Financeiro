name: Validate OPEX Context Race Selectable Infos

on:
  push:
    branches:
      - fix/opex-context-race-selectable-infos-20260826

permissions:
  contents: write

jobs:
  build:
    if: github.event.head_commit.message == 'Valida correcao OPEX e Infos selecionavel'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Apply source patch
        shell: pwsh
        run: ./.github/scripts/apply-opex-race-selectable.ps1
      - name: Restore
        run: dotnet restore HubFinanceiro.csproj
      - name: Build
        run: dotnet build HubFinanceiro.csproj --configuration Debug --no-restore --nologo
      - name: OPEX context barrier tests
        shell: pwsh
        run: |
          $dll = Join-Path $PWD 'bin\Debug\net8.0-windows\HubFinanceiro.dll'
          $assembly = [System.Reflection.Assembly]::LoadFrom($dll)
          $type = $assembly.GetType('HubFinanceiro.SantanderCommitmentMemoryService', $true)
          $flags = [System.Reflection.BindingFlags]::Static -bor [System.Reflection.BindingFlags]::NonPublic
          $method = $type.GetMethod('IsSafeSnapshotAfterContextSwitch', $flags)
          if (-not $method) { throw 'Metodo de validacao da barreira nao encontrado.' }

          $troca = [DateTime]::new(2026, 8, 26, 18, 15, 20, [DateTimeKind]::Local)
          $old = '2|R$ 6.405,24|ADM'
          $new = '0|R$ 0,00|COR'

          function Invoke-Barrier([DateTime]$captured, [string]$table, [bool]$sawEmpty) {
            return [bool]$method.Invoke($null, @($captured, $troca, $table, $old, $sawEmpty))
          }

          if (Invoke-Barrier $troca.AddMilliseconds(-100) $old $false) { throw 'Snapshot anterior foi aceito.' }
          if (Invoke-Barrier $troca.AddSeconds(2) $old $false) { throw 'Tabela antiga sem transicao vazia foi aceita.' }
          if (-not (Invoke-Barrier $troca.AddSeconds(2) $old $true)) { throw 'Resultado apos tela vazia foi bloqueado.' }
          if (-not (Invoke-Barrier $troca.AddSeconds(2) $new $false)) { throw 'Nova composicao foi bloqueada.' }
          Write-Host 'Barreira de troca de convenio validada.'
      - name: Commit validated source
        shell: pwsh
        run: |
          git add SantanderCommitmentMemoryService.cs InfosPositivaWindow.xaml SantanderMonitorServiceTestes.cs
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { exit 0 }
          git config user.name "Alexandre Mallorca"
          git config user.email "99052118+AlexMalls@users.noreply.github.com"
          git commit -m "Corrige atribuicao de contexto OPEX e habilita copia em Infos Positiva"
          git push
