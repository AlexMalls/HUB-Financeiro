name: Validate HUB Context Info About

on:
  push:
    branches:
      - feat/contextos-persistentes-infos-sobre-20260826

permissions:
  contents: write

jobs:
  build:
    # Validação Windows/.NET 8 da implementação completa.
    if: github.event.head_commit.message == 'Valida implementacoes HUB contexto infos sobre'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Apply source patch
        shell: pwsh
        run: ./.github/scripts/apply-context-info-about.ps1
      - name: Restore
        run: dotnet restore HubFinanceiro.csproj
      - name: Build
        run: dotnet build HubFinanceiro.csproj --configuration Debug --no-restore --nologo
      - name: Commit validated source
        shell: pwsh
        run: |
          git add SantanderCommitmentMemoryService.cs OpexDebugInspectorWindow.xaml OpexDebugInspectorWindow.xaml.cs MainWindow.xaml
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { exit 0 }
          git config user.name "Alexandre Mallorca"
          git config user.email "99052118+AlexMalls@users.noreply.github.com"
          git commit -m "Aplica persistencia OPEX e novos menus informativos"
          git push
