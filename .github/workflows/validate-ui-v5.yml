name: Validate UI V5

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate-ui:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore HubFinanceiro.csproj

      - name: Build
        run: dotnet build HubFinanceiro.csproj --configuration Debug --no-restore --nologo

      - name: Run UI regression tests
        shell: pwsh
        run: dotnet .\bin\Debug\net8.0-windows\HubFinanceiro.dll --validar-ajustes-ui

      - name: Publish test build
        shell: pwsh
        run: >-
          dotnet publish HubFinanceiro.csproj
          --configuration Release
          --output .\dist\app
          --self-contained false
          /p:PublishReadyToRun=false
          /p:PublishSingleFile=false
          --nologo

      - name: Create test installer
        shell: pwsh
        run: |
          $installer = @'
          @echo off
          setlocal EnableExtensions EnableDelayedExpansion
          title HUB Financeiro - Teste UI V7

          set "SOURCE=%~dp0app"
          set "TARGET=C:\Apps\HubFinanceiro\app"
          set "BACKUP_ROOT=C:\Users\Alexandre Mallorca\Documents\Projetos TI\HubFinanceiro_Backups"
          set "TARGET_EXISTED=0"

          echo.
          echo ========================================
          echo   HUB Financeiro - Teste visual UI V7
          echo ========================================
          echo.

          tasklist /FI "IMAGENAME eq HubFinanceiro.exe" 2>NUL | find /I "HubFinanceiro.exe" >NUL
          if not errorlevel 1 (
              echo ERRO: O HUB Financeiro esta aberto.
              echo Feche o programa e execute este instalador novamente.
              echo.
              pause
              exit /b 1
          )

          if not exist "%SOURCE%\HubFinanceiro.exe" (
              echo ERRO: A pasta app nao foi encontrada ao lado deste instalador.
              echo Extraia todo o ZIP antes de executar o CMD.
              echo.
              pause
              exit /b 1
          )

          for /f %%I in ('powershell -NoProfile -Command "Get-Date -Format yyyyMMdd_HHmmss"') do set "STAMP=%%I"
          if not defined STAMP set "STAMP=backup"
          set "BACKUP=%BACKUP_ROOT%\teste_ui_v7_%STAMP%"

          if not exist "%BACKUP_ROOT%" mkdir "%BACKUP_ROOT%" >NUL 2>&1
          if errorlevel 1 goto :backup_error

          if exist "%TARGET%\" (
              set "TARGET_EXISTED=1"
              mkdir "%BACKUP%" >NUL 2>&1
              if errorlevel 1 goto :backup_error

              echo [1/3] Criando backup da instalacao atual...
              robocopy "%TARGET%" "%BACKUP%" /MIR /R:2 /W:1 /NFL /NDL /NJH /NJS /NP >NUL
              if errorlevel 8 goto :backup_error
          ) else (
              echo [1/3] Nenhuma instalacao anterior encontrada. Backup nao necessario.
          )

          echo [2/3] Instalando a versao de teste V7...
          if not exist "%TARGET%" mkdir "%TARGET%" >NUL 2>&1
          if errorlevel 1 goto :install_error

          robocopy "%SOURCE%" "%TARGET%" /MIR /R:2 /W:1 /NFL /NDL /NJH /NJS /NP >NUL
          if errorlevel 8 goto :install_error

          if not exist "%TARGET%\HubFinanceiro.exe" goto :install_error

          echo [3/3] Validando arquivos instalados...
          "%TARGET%\HubFinanceiro.exe" --validar-ajustes-ui
          if errorlevel 1 goto :validation_error

          echo.
          echo ========================================
          echo   TESTE V7 INSTALADO COM SUCESSO
          echo ========================================
          echo.
          echo Pasta: "%TARGET%"
          if "%TARGET_EXISTED%"=="1" echo Backup: "%BACKUP%"
          echo.
          echo Abra o HUB normalmente e confira Fornecedores e O.P.E.X.
          echo.
          pause
          exit /b 0

          :validation_error
          echo.
          echo ERRO: A validacao automatica da V7 falhou.
          goto :rollback

          :install_error
          echo.
          echo ERRO: Falha ao copiar os arquivos da V7.
          goto :rollback

          :backup_error
          echo.
          echo ERRO: Nao foi possivel criar o backup da instalacao atual.
          echo Nenhum arquivo foi alterado.
          echo.
          pause
          exit /b 1

          :rollback
          echo Restaurando a instalacao anterior...
          rmdir /S /Q "%TARGET%" >NUL 2>&1
          if "%TARGET_EXISTED%"=="1" (
              mkdir "%TARGET%" >NUL 2>&1
              robocopy "%BACKUP%" "%TARGET%" /MIR /R:2 /W:1 /NFL /NDL /NJH /NJS /NP >NUL
              if errorlevel 8 (
                  echo ATENCAO: A restauracao automatica falhou.
                  echo O backup permanece em "%BACKUP%".
              ) else (
                  echo Instalacao anterior restaurada.
              )
          )
          echo.
          pause
          exit /b 1
          '@

          New-Item -ItemType Directory -Force -Path .\dist | Out-Null
          [System.IO.File]::WriteAllText(
              (Join-Path $PWD 'dist\INSTALAR_TESTE_UI_V7.cmd'),
              $installer,
              [System.Text.UTF8Encoding]::new($false))

          $readme = @'
          HUB Financeiro - Teste visual UI V7

          1. Extraia todo o ZIP.
          2. Feche o HUB Financeiro.
          3. Execute INSTALAR_TESTE_UI_V7.cmd.
          4. Abra o HUB e confira especialmente:
             - Fornecedores: bordas neutras e roxo apenas em estados ativos.
             - O.P.E.X.: botoes distribuidos em duas linhas, sem cortes.
             - Envio de E-mails: tabela Fornecedor | E-mail e pesquisa alinhada.
             - Sobre: logo Ennoia vetorial.

          O instalador cria backup da versao atual antes de substituir a pasta publicada.
          '@
          [System.IO.File]::WriteAllText(
              (Join-Path $PWD 'dist\LEIA-ME.txt'),
              $readme,
              [System.Text.UTF8Encoding]::new($false))

      - name: Upload test package
        uses: actions/upload-artifact@v4
        with:
          name: HUB-Financeiro-UI-V7-Teste
          path: dist
          if-no-files-found: error
          retention-days: 7
