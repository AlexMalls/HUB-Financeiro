name: Validate UI V5

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate-ui:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore HubFinanceiro.csproj

      - name: Build
        run: dotnet build HubFinanceiro.csproj --configuration Debug --no-restore --nologo

      - name: Run UI regression tests
        shell: pwsh
        run: dotnet .\bin\Debug\net8.0-windows\HubFinanceiro.dll --validar-ajustes-ui

      - name: Create lightweight V7 package
        shell: pwsh
        run: |
          $dist = Join-Path $PWD 'dist-v7-leve'
          $filesDir = Join-Path $dist 'arquivos'
          New-Item -ItemType Directory -Force -Path $filesDir | Out-Null

          $files = @(
            'MainWindow.UiCorrecoes.cs',
            'MainWindow.xaml',
            'MainWindow.xaml.cs',
            'SobreWindow.xaml',
            'SobreWindow.xaml.cs',
            'UiCorrecoesPolicy.cs',
            'UiCorrecoesTestes.cs'
          )

          foreach ($file in $files) {
            Copy-Item -LiteralPath (Join-Path $PWD $file) -Destination (Join-Path $filesDir $file) -Force
          }

          $installer = @'
          @echo off
          setlocal EnableExtensions
          title HUB Financeiro - Atualizacao UI V7 Leve

          set "PROJECT=C:\Users\Alexandre Mallorca\Documents\Projetos TI\HubFinanceiro"
          set "PACKAGE=%~dp0arquivos"
          set "APP=C:\Apps\HubFinanceiro\app"
          set "BACKUP_ROOT=C:\Users\Alexandre Mallorca\Documents\Projetos TI\HubFinanceiro_Backups"
          set "FILES=MainWindow.UiCorrecoes.cs MainWindow.xaml MainWindow.xaml.cs SobreWindow.xaml SobreWindow.xaml.cs UiCorrecoesPolicy.cs UiCorrecoesTestes.cs"
          set "APP_EXISTED=0"

          echo.
          echo =====================================================
          echo   HUB FINANCEIRO - ATUALIZACAO UI V7 LEVE
          echo =====================================================
          echo.
          echo Este pacote atualiza somente 7 arquivos do projeto.
          echo Ele cria backup, compila, testa e publica o HUB.
          echo.

          tasklist /FI "IMAGENAME eq HubFinanceiro.exe" 2>NUL | find /I "HubFinanceiro.exe" >NUL
          if not errorlevel 1 (
              echo ERRO: O HUB Financeiro esta aberto.
              echo Feche o programa e execute novamente.
              echo.
              pause
              exit /b 1
          )

          if not exist "%PROJECT%\HubFinanceiro.csproj" (
              echo ERRO: Projeto nao encontrado em:
              echo %PROJECT%
              echo.
              pause
              exit /b 1
          )

          if not exist "%PACKAGE%\" (
              echo ERRO: Pasta de arquivos do pacote nao encontrada.
              echo Extraia todo o ZIP antes de executar o CMD.
              echo.
              pause
              exit /b 1
          )

          for %%F in (%FILES%) do (
              if not exist "%PACKAGE%\%%F" (
                  echo ERRO: Arquivo ausente no pacote: %%F
                  echo.
                  pause
                  exit /b 1
              )
          )

          set "DOTNET=C:\Dotnet\dotnet.exe"
          if not exist "%DOTNET%" (
              where dotnet >NUL 2>&1
              if errorlevel 1 (
                  echo ERRO: .NET SDK nao encontrado.
                  echo.
                  pause
                  exit /b 1
              )
              set "DOTNET=dotnet"
          )

          for /f %%I in ('powershell -NoProfile -Command "Get-Date -Format yyyyMMdd_HHmmss"') do set "STAMP=%%I"
          if not defined STAMP set "STAMP=%RANDOM%"
          set "BACKUP=%BACKUP_ROOT%\Atualizacao_UI_V7_%STAMP%"
          set "BACKUP_SOURCE=%BACKUP%\source"
          set "BACKUP_APP=%BACKUP%\app"

          echo [1/7] Criando backup...
          if not exist "%BACKUP_ROOT%" mkdir "%BACKUP_ROOT%" >NUL 2>&1
          if errorlevel 1 goto :backup_error
          mkdir "%BACKUP_SOURCE%" >NUL 2>&1
          if errorlevel 1 goto :backup_error

          for %%F in (%FILES%) do (
              if exist "%PROJECT%\%%F" (
                  copy /Y "%PROJECT%\%%F" "%BACKUP_SOURCE%\%%F" >NUL
                  if errorlevel 1 goto :backup_error
              ) else (
                  type NUL > "%BACKUP_SOURCE%\%%F.__nao_existia__"
              )
          )

          if exist "%APP%\" (
              set "APP_EXISTED=1"
              mkdir "%BACKUP_APP%" >NUL 2>&1
              if errorlevel 1 goto :backup_error
              robocopy "%APP%" "%BACKUP_APP%" /MIR /R:2 /W:1 /NFL /NDL /NJH /NJS /NP >NUL
              if errorlevel 8 goto :backup_error
          )

          echo [2/7] Instalando os 7 arquivos...
          for %%F in (%FILES%) do (
              copy /Y "%PACKAGE%\%%F" "%PROJECT%\%%F" >NUL
              if errorlevel 1 goto :install_error
          )

          pushd "%PROJECT%"
          if errorlevel 1 goto :install_error

          echo [3/7] Limpando build anterior...
          "%DOTNET%" clean HubFinanceiro.csproj --configuration Release --nologo
          if errorlevel 1 goto :build_error

          echo [4/7] Restaurando dependencias...
          "%DOTNET%" restore HubFinanceiro.csproj --nologo
          if errorlevel 1 goto :build_error

          echo [5/7] Compilando em Release...
          "%DOTNET%" build HubFinanceiro.csproj --configuration Release --no-restore --nologo
          if errorlevel 1 goto :build_error

          if not exist "bin\Release\net8.0-windows\HubFinanceiro.dll" goto :build_error

          echo [6/7] Executando validacao automatica...
          "%DOTNET%" "bin\Release\net8.0-windows\HubFinanceiro.dll" --validar-ajustes-ui
          if errorlevel 1 goto :test_error

          echo [7/7] Publicando aplicacao...
          "%DOTNET%" publish HubFinanceiro.csproj --configuration Release --output "%APP%" --self-contained false --no-restore /p:PublishReadyToRun=false /p:PublishSingleFile=false --nologo
          if errorlevel 1 goto :publish_error

          if not exist "%APP%\HubFinanceiro.exe" goto :publish_error
          if not exist "%APP%\HubFinanceiro.dll" goto :publish_error

          "%DOTNET%" "%APP%\HubFinanceiro.dll" --validar-ajustes-ui
          if errorlevel 1 goto :publish_error

          popd
          echo.
          echo =====================================================
          echo   ATUALIZACAO UI V7 CONCLUIDA COM SUCESSO
          echo =====================================================
          echo.
          echo Projeto: %PROJECT%
          echo Aplicacao: %APP%
          echo Backup: %BACKUP%
          echo.
          pause
          exit /b 0

          :build_error
          popd
          echo.
          echo ERRO: Falha durante a compilacao.
          goto :rollback

          :test_error
          popd
          echo.
          echo ERRO: A validacao automatica falhou.
          goto :rollback

          :publish_error
          popd
          echo.
          echo ERRO: Falha ao publicar ou validar a aplicacao publicada.
          goto :rollback

          :install_error
          echo.
          echo ERRO: Falha ao copiar os arquivos da atualizacao.
          goto :rollback

          :backup_error
          echo.
          echo ERRO: Nao foi possivel criar o backup.
          echo Nenhuma atualizacao foi concluida.
          echo.
          pause
          exit /b 1

          :rollback
          echo.
          echo Restaurando arquivos anteriores...
          for %%F in (%FILES%) do (
              if exist "%BACKUP_SOURCE%\%%F" (
                  copy /Y "%BACKUP_SOURCE%\%%F" "%PROJECT%\%%F" >NUL
              ) else if exist "%BACKUP_SOURCE%\%%F.__nao_existia__" (
                  if exist "%PROJECT%\%%F" del /Q "%PROJECT%\%%F" >NUL 2>&1
              )
          )

          echo Restaurando aplicacao publicada anterior...
          if "%APP_EXISTED%"=="1" (
              if exist "%APP%\" rmdir /S /Q "%APP%" >NUL 2>&1
              mkdir "%APP%" >NUL 2>&1
              robocopy "%BACKUP_APP%" "%APP%" /MIR /R:2 /W:1 /NFL /NDL /NJH /NJS /NP >NUL
              if errorlevel 8 (
                  echo ATENCAO: A restauracao da aplicacao falhou.
                  echo O backup permanece em: %BACKUP_APP%
              ) else (
                  echo Aplicacao anterior restaurada.
              )
          ) else (
              if exist "%APP%\" rmdir /S /Q "%APP%" >NUL 2>&1
          )

          echo.
          echo O backup foi preservado em:
          echo %BACKUP%
          echo.
          pause
          exit /b 1
          '@

          [System.IO.File]::WriteAllText(
            (Join-Path $dist 'INSTALAR_UI_V7_LEVE.cmd'),
            ($installer -replace "`r?`n", "`r`n"),
            [System.Text.UTF8Encoding]::new($false))

          $readme = @'
          HUB Financeiro - Atualizacao UI V7 Leve

          Conteudo:
          - INSTALAR_UI_V7_LEVE.cmd
          - pasta arquivos com somente os 7 arquivos alterados da V7

          Como usar:
          1. Extraia todo o ZIP.
          2. Feche o HUB Financeiro.
          3. Execute INSTALAR_UI_V7_LEVE.cmd.
          4. Aguarde backup, build, testes e publicacao.

          A PR #37 continua aberta ate a validacao visual final.
          '@

          [System.IO.File]::WriteAllText(
            (Join-Path $dist 'LEIA-ME.txt'),
            ($readme -replace "`r?`n", "`r`n"),
            [System.Text.UTF8Encoding]::new($false))

      - name: Upload lightweight V7 package
        uses: actions/upload-artifact@v4
        with:
          name: HUB-Financeiro-UI-V7-Leve
          path: dist-v7-leve
          if-no-files-found: error
          retention-days: 7
