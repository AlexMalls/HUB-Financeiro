name: Validate Conferir Pagamentos Final

on:
  push:
    branches:
      - feat/conferir-pagamentos-opex-20260826

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore HubFinanceiro.csproj
      - name: Build
        run: dotnet build HubFinanceiro.csproj --configuration Debug --no-restore --nologo
      - name: Reconciliation tests
        run: dotnet run --project HubFinanceiro.csproj --configuration Debug --no-build -- --validar-conferencia-pagamentos
