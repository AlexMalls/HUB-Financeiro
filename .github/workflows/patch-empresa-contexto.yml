name: Patch Empresa Contexto Santander

on:
  push:
    branches:
      - fix/empresa-contexto-convenio-20260826

permissions:
  contents: write

jobs:
  patch-build:
    if: github.event.head_commit.message == 'Aplica e valida correção do nome da empresa por convênio'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Patch source
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import re

          path = Path('SantanderCommitmentMemoryService.cs')
          s = path.read_text(encoding='utf-8')

          old_constants = '''    private const string AdministradoraConvenio = "0033-3409-004902845301";
              private const string CorretoraConvenio = "0033-4268-004905078983";'''.replace('              ', '    ')
          new_constants = '''    private const string AdministradoraConvenio = "0033-3409-004902845301";
              private const string CorretoraConvenio = "0033-4268-004905078983";
              private const string AdministradoraCompanyName = "POSITIVA ADMINISTRADORA DE BENEFÍCIOS LTDA";
              private const string CorretoraCompanyName = "POSITIVA CORRETORA DE SEGUROS LTDA";'''.replace('              ', '    ')
          if old_constants not in s:
              raise SystemExit('constants target not found')
          s = s.replace(old_constants, new_constants, 1)

          old_company = '''            var company = string.IsNullOrWhiteSpace(detection.Empresa)
              ? "Empresa não identificada"
              : detection.Empresa;'''.replace('              ', '                ')
          new_company = '''            // O convênio já é a fonte de verdade do contexto; o nome exibido da
              // empresa segue a mesma origem para impedir resíduos da árvore do Edge.
              var company = CanonicalCompanyNameFromConvenio(detection.Convenio);'''.replace('              ', '            ')
          if old_company not in s:
              raise SystemExit('capture company target not found')
          s = s.replace(old_company, new_company, 1)

          start = s.index('        var candidates = new List<CompanyCandidate>();', s.index('private static ContextDetection DetectCompanyContext'))
          end_marker = '''        return new ContextDetection(
              true,
              context,
              company ?? string.Empty,
              convenio);'''.replace('              ', '            ')
          end = s.index(end_marker, start) + len(end_marker)
          replacement = '''        // Empresa também é determinada pelo convênio. Não dependemos mais do
          // texto de empresa exposto pela árvore de acessibilidade, que pode manter
          // nós residuais do convênio anterior após Trocar Convênio.
          var company = CanonicalCompanyNameFromConvenio(convenio);

          return new ContextDetection(
              true,
              context,
              company,
              convenio);'''
          s = s[:start] + replacement + s[end:]

          marker = '    private static string ClassifyContextFromConvenio(string convenio)\n'
          if marker not in s:
              raise SystemExit('classify marker not found')
          method = '''    private static string CanonicalCompanyNameFromConvenio(string convenio)
          {
              if (string.Equals(convenio, CorretoraConvenio, StringComparison.OrdinalIgnoreCase))
                  return CorretoraCompanyName;

              if (string.Equals(convenio, AdministradoraConvenio, StringComparison.OrdinalIgnoreCase))
                  return AdministradoraCompanyName;

              return "Empresa não identificada";
          }

          '''
          s = s.replace(marker, method + marker, 1)

          path.write_text(s, encoding='utf-8', newline='\n')
          '@ | Set-Content patch.py -Encoding UTF8
          python patch.py

      - name: Restore
        run: dotnet restore HubFinanceiro.csproj

      - name: Build
        run: dotnet build HubFinanceiro.csproj --configuration Debug --no-restore --nologo

      - name: Commit validated fix
        shell: pwsh
        run: |
          git config user.name "Alexandre Mallorca"
          git config user.email "99052118+AlexMalls@users.noreply.github.com"
          git add SantanderCommitmentMemoryService.cs
          git commit -m "Corrige nome da empresa pelo convenio Santander"
          git push
