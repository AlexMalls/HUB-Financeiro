name: Validate Empresa Contexto Santander

on:
  push:
    branches:
      - fix/empresa-contexto-convenio-20260826

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Apply patch
        shell: pwsh
        run: ./.github/scripts/patch-empresa-contexto.ps1
      - name: Restore
        run: dotnet restore HubFinanceiro.csproj
      - name: Build
        run: dotnet build HubFinanceiro.csproj --configuration Debug --no-restore --nologo
      - name: Commit source if changed
        shell: pwsh
        run: |
          git add SantanderCommitmentMemoryService.cs
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { exit 0 }
          git config user.name "Alexandre Mallorca"
          git config user.email "99052118+AlexMalls@users.noreply.github.com"
          git commit -m "Corrige empresa exibida pelo convenio Santander"
          git push
