name: Validate Conferir Pagamentos OPEX

on:
  push:
    branches:
      - feat/conferir-pagamentos-opex-20260826

permissions:
  contents: write

jobs:
  build:
    if: github.event.head_commit.message == 'Dispara validacao Conferir Pagamentos'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Apply source patch
        shell: pwsh
        run: |
          $patchPath = './.github/scripts/apply-conferir-pagamentos.ps1'
          $patch = [System.IO.File]::ReadAllText($patchPath).Replace("`r`n", "`n")
          $wrong = "                if (data.DayOfWeek == DayOfWeek.Saturday || `n                   data.DayOfWeek == DayOfWeek.Sunday)"
          $right = "                if (data.DayOfWeek == DayOfWeek.Saturday || data.DayOfWeek == DayOfWeek.Sunday)"
          if (-not $patch.Contains($wrong)) { throw 'Trecho de compatibilidade da data nao encontrado no patch.' }
          $patch = $patch.Replace($wrong, $right)
          [System.IO.File]::WriteAllText($patchPath, $patch, [System.Text.UTF8Encoding]::new($false))
          & $patchPath

      - name: Restore
        run: dotnet restore HubFinanceiro.csproj

      - name: Build
        run: dotnet build HubFinanceiro.csproj --configuration Debug --no-restore --nologo

      - name: Reconciliation tests
        run: dotnet run --project HubFinanceiro.csproj --configuration Debug --no-build -- --validar-conferencia-pagamentos

      - name: Commit validated source
        shell: pwsh
        run: |
          git add MainWindow.xaml MainWindow.xaml.cs CustomMessageBox.xaml.cs SelecionarDataWindow.xaml SelecionarDataWindow.xaml.cs Program.cs SantanderCommitmentAnalyzerService.cs SantanderCommitmentMemoryService.cs
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { exit 0 }
          git config user.name "Alexandre Mallorca"
          git config user.email "99052118+AlexMalls@users.noreply.github.com"
          git commit -m "Implementa Conferir Pagamentos no OPEX"
          git push
