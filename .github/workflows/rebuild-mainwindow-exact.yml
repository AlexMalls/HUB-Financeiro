name: Rebuild MainWindow Exact

on:
  push:
    branches:
      - feat/conferir-pagamentos-opex-20260826

permissions:
  contents: write

jobs:
  rebuild:
    if: github.event.head_commit.message == 'Reconstrói MainWindow exato com botão Conferir Pagamentos'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Rebuild exact MainWindow.xaml
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config core.autocrlf false
          git fetch origin 7f20a5551722d14d94f9c1afa5c28bb1a2fe420d --depth=1
          cmd /c "git cat-file blob 2acc92c2d7de01a0cb974d50cd2d49bc7f44eeda > MainWindow.xaml"

          $path = 'MainWindow.xaml'
          $text = [IO.File]::ReadAllText($path)

          $column = '                                        <ColumnDefinition Width="135"/>  <!-- Botão Importar -->'
          $columnReplacement = $column + "`r`n" + '                                        <ColumnDefinition Width="8"/>    <!-- Espaçamento -->' + "`r`n" + '                                        <ColumnDefinition Width="155"/>  <!-- Conferir Pagamentos -->'
          if (($text.Split($column).Count - 1) -ne 1) { throw 'Coluna de Importar não encontrada de forma única.' }
          $text = $text.Replace($column, $columnReplacement)

          $button = @'

                                    <!-- Botão Conferir Pagamentos -->
                                    <Button x:Name="BtnConferirPagamentos"
                                            Grid.Column="14"
                                            Content="Conferir Pagamentos"
                                            Height="38"
                                            Background="#2D6D50"
                                            Foreground="White"
                                            BorderThickness="0"
                                            FontWeight="SemiBold"
                                            FontSize="13"
                                            Cursor="Hand"
                                            Click="BtnConferirPagamentos_Click">
                                        <Button.Style>
                                            <Style TargetType="Button">
                                                <Setter Property="Background" Value="#2D6D50"/>
                                                <Setter Property="Template">
                                                    <Setter.Value>
                                                        <ControlTemplate TargetType="Button">
                                                            <Border Background="{TemplateBinding Background}"
                                                                   CornerRadius="6"
                                                                   BorderThickness="0">
                                                                <ContentPresenter HorizontalAlignment="Center"
                                                                                 VerticalAlignment="Center"/>
                                                            </Border>
                                                        </ControlTemplate>
                                                    </Setter.Value>
                                                </Setter>
                                                <Style.Triggers>
                                                    <Trigger Property="IsMouseOver" Value="True">
                                                        <Setter Property="Background" Value="#388563"/>
                                                    </Trigger>
                                                </Style.Triggers>
                                            </Style>
                                        </Button.Style>
                                    </Button>
'@
          $button = $button.Replace("`r`n","`n").Replace("`n","`r`n")

          $pattern = '(?s)(<!-- Botão Movimentar Registros -->.*?</Button>)(\r\n\s*</Grid>\r\n\s*<!-- ============================================ -->\r\n\s*<!-- LISTA DE PREVISÕES DE PAGAMENTO -->)'
          $regex = [Text.RegularExpressions.Regex]::new($pattern)
          if ($regex.Matches($text).Count -ne 1) { throw 'Ponto de inserção do botão não encontrado de forma única.' }
          $text = $regex.Replace($text, ('$1' + $button + '$2'), 1)

          [IO.File]::WriteAllText($path, $text, [Text.UTF8Encoding]::new($false))

      - name: Restore
        run: dotnet restore HubFinanceiro.csproj
      - name: Build
        run: dotnet build HubFinanceiro.csproj --configuration Debug --no-restore --nologo
      - name: Commit exact XAML
        shell: pwsh
        run: |
          git config core.autocrlf false
          git add MainWindow.xaml
          git config user.name "Alexandre Mallorca"
          git config user.email "99052118+AlexMalls@users.noreply.github.com"
          git commit -m "Mantém somente alteração real no MainWindow XAML"
          git push
