name: Validate Santander Convenio

on:
  push:
    branches:
      - fix/santander-convenio-contexto-20260826

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore HubFinanceiro.csproj
      - name: Build
        run: dotnet build HubFinanceiro.csproj --configuration Debug --no-restore --nologo
