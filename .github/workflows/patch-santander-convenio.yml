name: Patch Santander Convenio Context

on:
  push:
    branches:
      - fix/santander-convenio-contexto-20260826

permissions:
  contents: write

jobs:
  patch-and-build:
    if: github.event.head_commit.message == 'Aplica correção de contexto por convênio'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Patch sources
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import re

          service = Path('SantanderCommitmentMemoryService.cs')
          s = service.read_text(encoding='utf-8')

          s = s.replace(
              'public sealed record SantanderCommitmentMemoryEntry(\n    string Banco,\n    string Contexto,\n    string Empresa,',
              'public sealed record SantanderCommitmentMemoryEntry(\n    string Banco,\n    string Contexto,\n    string Convenio,\n    string Empresa,'
          )
          s = s.replace(
              '    public string ContextKey => $"{Banco}|{Contexto}";\n    public string StorageKey => $"{Banco}|{Contexto}|{DataInicial}|{DataFinal}";',
              '    public string ContextKey => $"{Banco}|{Contexto}|{Convenio}";\n    public string StorageKey => $"{Banco}|{Contexto}|{Convenio}|{DataInicial}|{DataFinal}";'
          )
          s = s.replace(
              '    private const string BankName = "Santander";\n    private const string EdgeProcessName = "msedge";',
              '    private const string BankName = "Santander";\n    private const string EdgeProcessName = "msedge";\n    private const string AdministradoraConvenio = "0033-3409-004902845301";\n    private const string CorretoraConvenio = "0033-4268-004905078983";'
          )

          capture_pattern = re.compile(r'    private static void CaptureContextAndStore\(SantanderCommitmentSnapshot snapshot, string tableSignature\)\n    \{.*?\n    \}\n\n(?=    private static void PublishContextDiagnosticOnce)', re.S)
          capture_replacement = '''    private static void CaptureContextAndStore(SantanderCommitmentSnapshot snapshot, string tableSignature)
    {
        try
        {
            var detection = DetectCompanyContext();
            if (!detection.OnCommitmentScreen)
                return;

            if (string.IsNullOrWhiteSpace(detection.Convenio) ||
                string.Equals(detection.Contexto, "Não identificado", StringComparison.OrdinalIgnoreCase))
            {
                PublishContextDiagnosticOnce("Número do convênio conhecido ainda não foi exposto de forma visível; snapshot aguardará a próxima sonda.");
                return;
            }

            var company = string.IsNullOrWhiteSpace(detection.Empresa)
                ? "Empresa não identificada"
                : detection.Empresa;

            var contextKey = $"{BankName}|{detection.Contexto}|{detection.Convenio}";
            var contextChanged = false;
            string previousContext;

            lock (Sync)
            {
                previousContext = _lastDetectedContextKey;
                if (!string.Equals(previousContext, contextKey, StringComparison.OrdinalIgnoreCase))
                {
                    _lastDetectedContextKey = contextKey;
                    contextChanged = true;
                }
                _lastContextDiagnostic = string.Empty;
            }

            if (contextChanged)
            {
                var previousDisplay = string.IsNullOrWhiteSpace(previousContext)
                    ? "nenhum"
                    : previousContext.Replace("|", " — ");

                DebugService.Record(
                    "SANTANDER",
                    $"Contexto bancário detectado/alterado | {previousDisplay} → {BankName} — {detection.Contexto} | Convênio: {detection.Convenio} | Empresa: {company}.",
                    DebugEntryLevel.Action);
            }

            // O número do convênio é a fonte de verdade do contexto. A assinatura
            // não inclui o período dos inputs para não associar uma tabela antiga a
            // uma data recém-selecionada antes do resultado realmente ser carregado.
            var compositeSignature = $"{contextKey}|{tableSignature}";

            lock (Sync)
            {
                if (string.Equals(compositeSignature, _lastStoredCompositeSignature, StringComparison.Ordinal))
                    return;

                _lastStoredCompositeSignature = compositeSignature;
            }

            Store(snapshot, detection.Contexto, detection.Convenio, company);
        }
        catch (Exception ex)
        {
            PublishContextDiagnosticOnce(
                $"Falha temporária ao identificar convênio/contexto ({ex.GetType().Name}); nenhum snapshot será classificado incorretamente.");
        }
        finally
        {
            lock (Sync)
                _captureInProgress = false;
        }
    }

'''
          s, count = capture_pattern.subn(capture_replacement, s, count=1)
          if count != 1:
              raise SystemExit('CaptureContextAndStore patch failed')

          store_pattern = re.compile(r'    private static void Store\(SantanderCommitmentSnapshot snapshot, string context, string company\)\n    \{.*?\n    \}\n\n(?=    private static void TrimUnsafe)', re.S)
          store_replacement = '''    private static void Store(SantanderCommitmentSnapshot snapshot, string context, string convenio, string company)
    {
        var dataInicial = snapshot.DataInicial?.Trim() ?? string.Empty;
        var dataFinal = snapshot.DataFinal?.Trim() ?? dataInicial;
        var total = snapshot.TotalPagamentos ?? snapshot.Pagamentos.Count;
        var totalValue = snapshot.ValorTotal?.Trim();
        if (string.IsNullOrWhiteSpace(totalValue) && snapshot.ValorTotalNumerico.HasValue)
            totalValue = snapshot.ValorTotalNumerico.Value.ToString("C2", new System.Globalization.CultureInfo("pt-BR"));
        totalValue ??= string.Empty;

        var entry = new SantanderCommitmentMemoryEntry(
            BankName,
            context,
            convenio,
            company,
            DateTime.Now,
            dataInicial,
            dataFinal,
            snapshot.SituacaoFiltro?.Trim() ?? string.Empty,
            total,
            totalValue,
            snapshot.ValorTotalNumerico,
            snapshot.Pagamentos.ToList());

        lock (Sync)
        {
            Entries[entry.StorageKey] = entry;
            TrimUnsafe(entry.ContextKey);
        }

        DebugService.Record(
            "SANTANDER",
            $"Memória contextual atualizada | Banco: {entry.Banco} | Contexto: {entry.Contexto} | Convênio: {entry.Convenio} | Empresa: {entry.Empresa} | Período: {entry.Periodo} | Pagamentos: {entry.TotalPagamentos} | Valor total: {entry.ValorTotal}.",
            DebugEntryLevel.Background);

        Application.Current?.Dispatcher.BeginInvoke(new Action(() => MemoryChanged?.Invoke()));
    }

'''
          s, count = store_pattern.subn(store_replacement, s, count=1)
          if count != 1:
              raise SystemExit('Store patch failed')

          detect_pattern = re.compile(r'    private static ContextDetection DetectCompanyContext\(\)\n    \{.*?\n    \}\n\n(?=    private static bool FindAnyExactName)', re.S)
          detect_replacement = '''    private static ContextDetection DetectCompanyContext()
    {
        var window = DetectSantanderWindow();
        if (window == null)
            return ContextDetection.NotAvailable;

        var root = AutomationElement.FromHandle(window.Value.Handle);
        if (root == null)
            return ContextDetection.NotAvailable;

        if (!FindAnyExactName(root, CommitmentScreenNames))
            return ContextDetection.NotAvailable;

        // Fonte de verdade: Número do convênio visível no cabeçalho da própria
        // tela Consultar compromissos. O nome da empresa é apenas metadado visual.
        var convenio = FindVisibleKnownConvenio(root);
        var context = ClassifyContextFromConvenio(convenio);

        var candidates = new List<CompanyCandidate>();
        try
        {
            var textNodes = root.FindAll(
                TreeScope.Descendants,
                new PropertyCondition(AutomationElement.ControlTypeProperty, ControlType.Text));

            foreach (AutomationElement node in textNodes)
            {
                var name = NormalizeWhitespace(SafeName(node));
                if (string.IsNullOrWhiteSpace(name) || name.Length > 180)
                    continue;

                if (!name.Contains("POSITIVA", StringComparison.OrdinalIgnoreCase) &&
                    !name.Contains("ADMINISTRADORA", StringComparison.OrdinalIgnoreCase) &&
                    !name.Contains("CORRETORA", StringComparison.OrdinalIgnoreCase))
                {
                    continue;
                }

                if (!TryGetVisibleRectangle(node, out var top, out var left))
                    continue;

                candidates.Add(new CompanyCandidate(name, top, left));
            }
        }
        catch (Exception ex) when (IsExpectedUiAutomationException(ex))
        {
        }

        var company = candidates
            .Where(candidate => candidate.Text.Contains("POSITIVA", StringComparison.OrdinalIgnoreCase))
            .OrderBy(candidate => candidate.Top)
            .ThenBy(candidate => candidate.Left)
            .ThenByDescending(candidate => ContextPriority(candidate.Text))
            .Select(candidate => candidate.Text)
            .FirstOrDefault();

        company ??= candidates
            .OrderBy(candidate => candidate.Top)
            .ThenBy(candidate => candidate.Left)
            .ThenByDescending(candidate => ContextPriority(candidate.Text))
            .Select(candidate => candidate.Text)
            .FirstOrDefault();

        return new ContextDetection(
            true,
            context,
            company ?? string.Empty,
            convenio);
    }

    private static string FindVisibleKnownConvenio(AutomationElement root)
    {
        var matches = new List<CompanyCandidate>();

        foreach (var known in new[] { AdministradoraConvenio, CorretoraConvenio })
        {
            try
            {
                var elements = root.FindAll(
                    TreeScope.Descendants,
                    new PropertyCondition(
                        AutomationElement.NameProperty,
                        known,
                        PropertyConditionFlags.IgnoreCase));

                foreach (AutomationElement element in elements)
                {
                    if (TryGetVisibleRectangle(element, out var top, out var left))
                        matches.Add(new CompanyCandidate(known, top, left));
                }
            }
            catch (Exception ex) when (IsExpectedUiAutomationException(ex))
            {
            }
        }

        return matches
            .OrderBy(candidate => candidate.Top)
            .ThenBy(candidate => candidate.Left)
            .Select(candidate => candidate.Text)
            .FirstOrDefault() ?? string.Empty;
    }

'''
          s, count = detect_pattern.subn(detect_replacement, s, count=1)
          if count != 1:
              raise SystemExit('DetectCompanyContext patch failed')

          classify_pattern = re.compile(r'    private static string ClassifyContext\(string company\)\n    \{.*?\n    \}\n', re.S)
          classify_replacement = '''    private static string ClassifyContextFromConvenio(string convenio)
    {
        if (string.Equals(convenio, CorretoraConvenio, StringComparison.OrdinalIgnoreCase))
            return "Corretora";

        if (string.Equals(convenio, AdministradoraConvenio, StringComparison.OrdinalIgnoreCase))
            return "Administradora";

        return "Não identificado";
    }
'''
          s, count = classify_pattern.subn(classify_replacement, s, count=1)
          if count != 1:
              raise SystemExit('ClassifyContext patch failed')

          s = s.replace(
              '    private sealed record ContextDetection(bool OnCommitmentScreen, string Contexto, string Empresa)\n    {\n        public static ContextDetection NotAvailable { get; } = new(false, "Não identificado", string.Empty);\n    }',
              '    private sealed record ContextDetection(bool OnCommitmentScreen, string Contexto, string Empresa, string Convenio)\n    {\n        public static ContextDetection NotAvailable { get; } = new(false, "Não identificado", string.Empty, string.Empty);\n    }'
          )

          service.write_text(s, encoding='utf-8', newline='\n')

          inspector = Path('OpexDebugInspectorWindow.xaml.cs')
          i = inspector.read_text(encoding='utf-8')
          old = '        CompanyText.Text = entry.Empresa;'
          new = '        CompanyText.Text = string.IsNullOrWhiteSpace(entry.Convenio)\\n            ? entry.Empresa\\n            : $"{entry.Empresa} • Convênio {entry.Convenio}";'
          if old not in i:
              raise SystemExit('Inspector patch target not found')
          i = i.replace(old, new)
          i = i.replace('\\n', '\n')
          inspector.write_text(i, encoding='utf-8', newline='\n')
          '@ | Set-Content patch.py -Encoding UTF8
          python patch.py

      - name: Restore
        run: dotnet restore HubFinanceiro.csproj

      - name: Build
        run: dotnet build HubFinanceiro.csproj --configuration Debug --no-restore --nologo

      - name: Commit validated fix
        shell: pwsh
        run: |
          git config user.name "Alexandre Mallorca"
          git config user.email "99052118+AlexMalls@users.noreply.github.com"
          git add SantanderCommitmentMemoryService.cs OpexDebugInspectorWindow.xaml.cs
          git commit -m "Corrige contexto Santander pelo numero do convenio"
          git push
