name: Fix MainWindow line ending

on:
  push:
    branches:
      - feat/conferir-pagamentos-opex-20260826

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message == 'Corrige line ending do MainWindow XAML'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore CRLF in MainWindow.xaml
        shell: pwsh
        run: |
          $path = 'MainWindow.xaml'
          $content = [System.IO.File]::ReadAllText($path)
          $content = $content.Replace("`r`n", "`n").Replace("`r", "`n").Replace("`n", "`r`n")
          [System.IO.File]::WriteAllText($path, $content, [System.Text.UTF8Encoding]::new($false))
          git add MainWindow.xaml
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { exit 0 }
          git config user.name "Alexandre Mallorca"
          git config user.email "99052118+AlexMalls@users.noreply.github.com"
          git commit -m "Restaura formato original do MainWindow XAML"
          git push
